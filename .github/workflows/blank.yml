YAML
name: Build Java Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Java (JDK 21) einrichten
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Projekt mit Maven bauen
      run: mvn clean package --file ClanSystem/pom.xml

    - name: JAR-Datei als Artifact hochladen
      uses: actions/upload-artifact@v4
      with:
        name: ClanSystem-Plugin
        path: ClanSystem/target/*.jar
